<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONDOR — Galeri Logo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<style>
  .brand { letter-spacing: .22em; }
  .thumb { height: 150px; }
  .thumb img { max-height: 118px; }
  .lb-img { max-height: 70svh; }
  .card { transition: transform .18s ease, border-color .18s ease; }
  .card:hover { transform: translateY(-2px); }
  .grid-fade { transition: opacity .2s ease; }
</style>
</head>
<body>
<div class="container-xxl d-flex flex-column" style="min-height:100svh">
  <header class="text-center pt-4 pb-2">
    <h1 class="h4 fw-bold text-uppercase brand mb-1">Mondor</h1>
    <div class="small text-secondary" id="count">memuat…</div>
  </header>

  <main class="flex-grow-1 d-flex">
    <div class="row g-3 justify-content-center w-100 my-auto" id="grid" aria-live="polite"></div>
  </main>

  <footer class="text-center small text-secondary py-3">
    <span id="host"></span>
  </footer>
</div>

<div class="modal fade" id="lb" tabindex="-1" aria-labelledby="lbName" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h2 class="h6 mb-0 text-truncate" id="lbName"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body text-center bg-white p-3 p-md-4">
        <img id="lbImg" class="img-fluid lb-img mx-auto d-block" alt="">
      </div>
      <div class="modal-footer justify-content-center gap-2 py-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="lbPrev">&lsaquo; Sebelumnya</button>
        <button type="button" class="btn btn-sm btn-outline-info" id="lbCopy">Copy link</button>
        <a class="btn btn-sm btn-outline-secondary" id="lbOpen" target="_blank" rel="noopener">Buka asli</a>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="lbNext">Berikutnya &rsaquo;</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  var OWNER = "tghrsyahptra";
  var REPO = "mondor-logo";
  var BRANCH = "main";
  var BASE = "https://" + OWNER + ".github.io/" + REPO + "/";
  var IMG_RE = /\.(png|jpe?g|webp|avif|gif|svg)$/i;
  var FALLBACK = ["mondor-1.png", "mondor-2.png", "mondor-3.png", "mondor-4.png", "mondor-5.png", "mondor-6.png"];

  var grid = document.getElementById("grid");
  var countEl = document.getElementById("count");
  var items = [];
  var current = -1;
  var lbModal = null;

  document.getElementById("host").textContent = OWNER + "/" + REPO;

  function naturalSort(a, b) {
    return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
  }
  function isRootImage(name) {
    return IMG_RE.test(name) && name.indexOf("/") === -1;
  }

  function fromGithub() {
    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/?ref=" + BRANCH, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("github " + r.status); return r.json(); })
      .then(function (j) {
        if (!Array.isArray(j)) throw new Error("bad payload");
        return j.filter(function (x) { return x.type === "file"; })
                .map(function (x) { return x.name; })
                .filter(isRootImage);
      });
  }

  function fromJsdelivr() {
    return fetch("https://data.jsdelivr.com/v1/packages/gh/" + OWNER + "/" + REPO + "@" + BRANCH + "?structure=flat", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("jsdelivr " + r.status); return r.json(); })
      .then(function (j) {
        return (j.files || [])
          .map(function (f) { return String(f.name).replace(/^\//, ""); })
          .filter(isRootImage);
      });
  }

  function discover() {
    return fromGithub().then(function (list) {
      if (list && list.length) return list;
      throw new Error("empty");
    }).catch(function () {
      return fromJsdelivr().catch(function () { return FALLBACK.slice(); });
    });
  }

  function placeholders(n) {
    grid.innerHTML = "";
    for (var i = 0; i < n; i++) {
      var col = document.createElement("div");
      col.className = "col-12 col-sm-6 col-md-4 col-lg-3";
      col.innerHTML =
        '<div class="card h-100 placeholder-glow">' +
          '<div class="placeholder w-100 bg-secondary-subtle" style="height:150px"></div>' +
          '<div class="card-body py-2">' +
            '<span class="placeholder col-8 bg-secondary-subtle"></span>' +
          '</div>' +
        '</div>';
      grid.appendChild(col);
    }
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy") ? resolve() : reject(new Error("copy failed")); }
      catch (e) { reject(e); }
      finally { document.body.removeChild(ta); }
    });
  }

  function flash(btn, text) {
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = text || "tersalin!";
    btn.classList.add("disabled");
    setTimeout(function () {
      btn.textContent = btn.dataset.label;
      btn.classList.remove("disabled");
    }, 1400);
  }

  function render(list) {
    items = list;
    grid.innerHTML = "";
    countEl.textContent = list.length + " gambar";

    if (!list.length) {
      grid.innerHTML =
        '<div class="col-12"><div class="alert alert-secondary text-center mb-0">' +
        'Belum ada gambar di repo ini.</div></div>';
      return;
    }

    list.forEach(function (name, index) {
      var url = BASE + name;
      var label = name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");

      var col = document.createElement("div");
      col.className = "col-12 col-sm-6 col-md-4 col-lg-3";

      var card = document.createElement("div");
      card.className = "card h-100 bg-body-tertiary";

      var thumb = document.createElement("button");
      thumb.type = "button";
      thumb.className = "thumb btn p-2 w-100 bg-white rounded-0 rounded-top d-flex align-items-center justify-content-center";
      thumb.setAttribute("aria-label", "Perbesar " + name);

      var img = document.createElement("img");
      img.src = url;
      img.alt = label;
      img.loading = "lazy";
      img.decoding = "async";
      img.className = "img-fluid";
      thumb.appendChild(img);
      thumb.addEventListener("click", function () { openLb(index); });

      var body = document.createElement("div");
      body.className = "card-body py-2 px-3 d-flex align-items-center justify-content-between gap-2";

      var nm = document.createElement("small");
      nm.className = "text-secondary text-truncate";
      nm.textContent = name;
      nm.title = name;

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-sm btn-outline-info flex-shrink-0";
      btn.textContent = "copy";
      btn.setAttribute("aria-label", "Copy link " + name);
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        copyText(url).then(function () { flash(btn); }).catch(function () { window.prompt("Copy link:", url); });
      });

      body.appendChild(nm);
      body.appendChild(btn);
      card.appendChild(thumb);
      card.appendChild(body);
      col.appendChild(card);
      grid.appendChild(col);
    });
  }

  var lbEl = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");
  var lbName = document.getElementById("lbName");
  var lbOpen = document.getElementById("lbOpen");
  var lbCopy = document.getElementById("lbCopy");
  var lbPrev = document.getElementById("lbPrev");
  var lbNext = document.getElementById("lbNext");

  function openLb(i) {
    if (i < 0 || i >= items.length) return;
    current = i;
    var url = BASE + items[i];
    lbImg.src = url;
    lbImg.alt = items[i];
    lbName.textContent = items[i];
    lbOpen.href = url;
    if (window.bootstrap) {
      lbModal = lbModal || bootstrap.Modal.getOrCreateInstance(lbEl);
      lbModal.show();
    } else {
      lbEl.classList.add("show", "d-block");
    }
  }

  function step(d) {
    if (current < 0 || !items.length) return;
    openLb((current + d + items.length) % items.length);
  }

  lbPrev.addEventListener("click", function () { step(-1); });
  lbNext.addEventListener("click", function () { step(1); });
  lbCopy.addEventListener("click", function () {
    copyText(lbImg.src).then(function () { flash(lbCopy); }).catch(function () { window.prompt("Copy link:", lbImg.src); });
  });
  lbEl.addEventListener("hidden.bs.modal", function () {
    lbImg.removeAttribute("src");
    current = -1;
  });
  document.addEventListener("keydown", function (e) {
    if (!lbEl.classList.contains("show")) return;
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  placeholders(6);
  discover()
    .then(function (list) { render((list || []).slice().sort(naturalSort)); })
    .catch(function () { render(FALLBACK.slice()); });
})();
</script>
</body>
</html>
