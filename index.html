<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONDOR — Galeri Logo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0d0d0f;
    --card: #17171a;
    --line: #2a2a2f;
    --text: #f4f4f5;
    --muted: #9a9aa2;
    --accent: #5aa9ff;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { display: flex; flex-direction: column; min-height: 100svh; }

  header {
    display: flex; align-items: baseline; justify-content: center;
    gap: 12px; flex-wrap: wrap;
    padding: 28px 20px 8px; text-align: center;
  }
  header h1 {
    margin: 0; font-size: 1.35rem; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
  }
  header .count {
    color: var(--muted); font-size: .8rem; letter-spacing: .08em;
  }

  .grid {
    display: flex; flex-wrap: wrap;
    justify-content: center; align-content: center;
    gap: 18px; padding: 24px; margin: auto;
    width: 100%; max-width: 1180px;
  }

  .card {
    flex: 0 1 250px; max-width: 250px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #3d3d44; }

  .thumb {
    all: unset; cursor: zoom-in; display: flex;
    align-items: center; justify-content: center;
    background: #fff; height: 140px; padding: 14px;
  }
  .thumb img {
    display: block; max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain; margin: auto;
  }

  .meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 10px 12px;
  }
  .meta .name {
    font-size: .76rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .copy {
    all: unset; cursor: pointer; flex: none;
    font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); border: 1px solid #2f4a6b;
    border-radius: 7px; padding: 5px 9px;
    transition: background .15s ease, color .15s ease;
  }
  .copy:hover { background: #17293f; }
  .copy.done { color: #7ee2a8; border-color: #2f6b4a; background: #12271b; }

  .skeleton {
    flex: 0 1 250px; height: 195px; border-radius: 14px;
    background: linear-gradient(100deg, #17171a 30%, #1e1e22 50%, #17171a 70%);
    background-size: 200% 100%; animation: sh 1.2s infinite linear;
  }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .empty {
    color: var(--muted); font-size: .9rem; text-align: center;
    padding: 40px; margin: auto;
  }

  /* lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(6, 6, 8, .92); backdrop-filter: blur(4px);
    padding: 24px;
  }
  .lb.open { display: flex; }
  .lb-inner {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; max-width: min(1100px, 100%); max-height: 100%;
  }
  .lb canvas, .lb img.lb-img {
    max-width: 100%; max-height: calc(100svh - 170px);
    object-fit: contain; border-radius: 8px;
    background:
      linear-gradient(45deg, #d9d9de 25%, transparent 25%, transparent 75%, #d9d9de 75%) 0 0 / 18px 18px,
      linear-gradient(45deg, #d9d9de 25%, #f4f4f6 25%, #f4f4f6 75%, #d9d9de 75%) 9px 9px / 18px 18px;
  }
  .lb-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    justify-content: center; color: var(--muted); font-size: .82rem;
  }
  .lb-bar a, .lb-bar button {
    all: unset; cursor: pointer; font-size: .78rem;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid #35353c; color: var(--text);
  }
  .lb-bar a:hover, .lb-bar button:hover { background: #1e1e23; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2rem; line-height: 1; padding: 10px 16px; cursor: pointer;
    color: #bbb; background: none; border: 0;
  }
  .lb-nav:hover { color: #fff; }
  .lb-nav.prev { left: 8px; }
  .lb-nav.next { right: 8px; }
  .lb-close {
    position: absolute; top: 10px; right: 14px;
    font-size: 1.8rem; line-height: 1; padding: 6px 12px; cursor: pointer;
    color: #ccc; background: none; border: 0;
  }
  .lb-close:hover { color: #fff; }

  @media (max-width: 520px) {
    .card, .skeleton { flex: 1 1 100%; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Mondor</h1>
    <span class="count" id="count">memuat…</span>
  </header>
  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Pratinjau gambar">
  <button class="lb-close" id="lbClose" aria-label="Tutup">&times;</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Sebelumnya">&#8249;</button>
  <button class="lb-nav next" id="lbNext" aria-label="Berikutnya">&#8250;</button>
  <div class="lb-inner">
    <img class="lb-img" id="lbImg" alt="">
    <div class="lb-bar">
      <span id="lbName"></span>
      <button id="lbCopy">Copy link</button>
      <a id="lbOpen" target="_blank" rel="noopener">Buka asli</a>
    </div>
  </div>
</div>

<script>
(function () {
  var OWNER = "tghrsyahptra";
  var REPO = "mondor-logo";
  var BRANCH = "main";
  var BASE = "https://" + OWNER + ".github.io/" + REPO + "/";
  var IMG_RE = /\.(png|jpe?g|webp|avif|gif|svg)$/i;
  var FALLBACK = ["mondor-1.png","mondor-2.png","mondor-3.png","mondor-4.png","mondor-5.png","mondor-6.png"];

  var grid = document.getElementById("grid");
  var countEl = document.getElementById("count");
  var items = [];
  var current = -1;

  function naturalSort(a, b) {
    return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
  }

  function isRootImage(name) {
    return IMG_RE.test(name) && name.indexOf("/") === -1;
  }

  function fromJsdelivr() {
    return fetch("https://data.jsdelivr.com/v1/packages/gh/" + OWNER + "/" + REPO + "@" + BRANCH + "?structure=flat", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("jsdelivr " + r.status); return r.json(); })
      .then(function (j) {
        return (j.files || []).map(function (f) { return String(f.name).replace(/^\//, ""); }).filter(isRootImage);
      });
  }

  function fromGithub() {
    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/?ref=" + BRANCH, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("github " + r.status); return r.json(); })
      .then(function (j) {
        if (!Array.isArray(j)) throw new Error("bad payload");
        return j.filter(function (x) { return x.type === "file"; }).map(function (x) { return x.name; }).filter(isRootImage);
      });
  }

  function discover() {
    return fromGithub().then(function (list) {
      if (list && list.length) return list;
      throw new Error("empty");
    }).catch(function () {
      return fromJsdelivr().catch(function () { return FALLBACK; });
    });
  }

  function skeleton(n) {
    grid.innerHTML = "";
    for (var i = 0; i < n; i++) {
      var s = document.createElement("div");
      s.className = "skeleton";
      grid.appendChild(s);
    }
  }

  function toast(btn) {
    var old = btn.textContent;
    btn.textContent = "tersalin!";
    btn.classList.add("done");
    setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1400);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy") ? resolve() : reject(new Error("copy failed")); }
      catch (e) { reject(e); }
      finally { document.body.removeChild(ta); }
    });
  }

  function render(list) {
    items = list;
    grid.innerHTML = "";
    countEl.textContent = list.length + " gambar";

    if (!list.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Belum ada gambar di repo ini.";
      grid.appendChild(e);
      return;
    }

    list.forEach(function (name, index) {
      var url = BASE + name;

      var card = document.createElement("article");
      card.className = "card";

      var thumb = document.createElement("button");
      thumb.className = "thumb";
      thumb.type = "button";
      thumb.setAttribute("aria-label", "Perbesar " + name);

      var img = document.createElement("img");
      img.src = url;
      img.alt = name.replace(/\.[^.]+$/, "");
      img.loading = "lazy";
      img.decoding = "async";

      thumb.appendChild(img);
      thumb.addEventListener("click", function () { openLb(index); });

      var meta = document.createElement("div");
      meta.className = "meta";

      var nm = document.createElement("span");
      nm.className = "name";
      nm.textContent = name;
      nm.title = name;

      var btn = document.createElement("button");
      btn.className = "copy";
      btn.type = "button";
      btn.textContent = "copy link";
      btn.addEventListener("click", function () {
        copyText(url).then(function () { toast(btn); }).catch(function () { window.prompt("Copy link:", url); });
      });

      meta.appendChild(nm);
      meta.appendChild(btn);
      card.appendChild(thumb);
      card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  /* lightbox */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");
  var lbName = document.getElementById("lbName");
  var lbOpen = document.getElementById("lbOpen");
  var lbCopy = document.getElementById("lbCopy");
  var lbPrev = document.getElementById("lbPrev");
  var lbNext = document.getElementById("lbNext");
  var lbClose = document.getElementById("lbClose");

  function openLb(i) {
    if (i < 0 || i >= items.length) return;
    current = i;
    var name = items[i];
    var url = BASE + name;
    lbImg.src = url;
    lbImg.alt = name;
    lbName.textContent = name;
    lbOpen.href = url;
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLb() {
    lb.classList.remove("open");
    lbImg.removeAttribute("src");
    document.body.style.overflow = "";
    current = -1;
  }

  function step(d) {
    if (current < 0 || !items.length) return;
    openLb((current + d + items.length) % items.length);
  }

  lbClose.addEventListener("click", closeLb);
  lbPrev.addEventListener("click", function (e) { e.stopPropagation(); step(-1); });
  lbNext.addEventListener("click", function (e) { e.stopPropagation(); step(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
  lbCopy.addEventListener("click", function () {
    copyText(lbImg.src).then(function () { toast(lbCopy); }).catch(function () { window.prompt("Copy link:", lbImg.src); });
  });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  /* boot */
  skeleton(6);
  discover()
    .then(function (list) { render((list || []).slice().sort(naturalSort)); })
    .catch(function () { render(FALLBACK.slice()); });
})();
</script>
</body>
</html>
