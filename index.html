<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONDOR - Galeri Gambar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10; color: #f5f5f5;
  }
  h1 { text-align: center; font-size: 1.6rem; letter-spacing: .15em; margin: 0 0 8px; }
  p.sub { text-align: center; color: #999; margin: 0 0 32px; font-size: .9rem; }
  .grid {
    display: grid; gap: 20px; max-width: 1100px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: #1a1a1c; border: 1px solid #2a2a2d; border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card a.img { display: block; background: #fff; }
  .card img { display: block; width: 100%; height: 200px; object-fit: contain; }
  .card .body { padding: 12px 14px; }
  .card .name { font-weight: 600; font-size: .95rem; margin-bottom: 8px; }
  .card a.link {
    display: block; font-size: .75rem; color: #7cb7ff; word-break: break-all;
    text-decoration: none; line-height: 1.4;
  }
  .card a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>MONDOR</h1>
  <p class="sub">Klik gambar untuk melihat ukuran penuh &middot; 5 gambar</p>
  <div class="grid">
    <div class="card">
      <a class="img" href="mondor-1.jpeg" target="_blank"><img src="mondor-1.jpeg" alt="MONDOR 1" loading="lazy"></a>
      <div class="body">
        <div class="name">Gambar 1</div>
        <a class="link" href="mondor-1.jpeg" target="_blank">mondor-1.jpeg</a>
      </div>
    </div>
    <div class="card">
      <a class="img" href="mondor-2.jpeg" target="_blank"><img src="mondor-2.jpeg" alt="MONDOR 2" loading="lazy"></a>
      <div class="body">
        <div class="name">Gambar 2</div>
        <a class="link" href="mondor-2.jpeg" target="_blank">mondor-2.jpeg</a>
      </div>
    </div>
    <div class="card">
      <a class="img" href="mondor-3.jpeg" target="_blank"><img src="mondor-3.jpeg" alt="MONDOR 3" loading="lazy"></a>
      <div class="body">
        <div class="name">Gambar 3</div>
        <a class="link" href="mondor-3.jpeg" target="_blank">mondor-3.jpeg</a>
      </div>
    </div>
    <div class="card">
      <a class="img" href="mondor-4.jpeg" target="_blank"><img src="mondor-4.jpeg" alt="MONDOR 4" loading="lazy"></a>
      <div class="body">
        <div class="name">Gambar 4</div>
        <a class="link" href="mondor-4.jpeg" target="_blank">mondor-4.jpeg</a>
      </div>
    </div>
    <div class="card">
      <a class="img" href="mondor-5.jpeg" target="_blank"><img src="mondor-5.jpeg" alt="MONDOR 5" loading="lazy"></a>
      <div class="body">
        <div class="name">Gambar 5</div>
        <a class="link" href="mondor-5.jpeg" target="_blank">mondor-5.jpeg</a>
      </div>
    </div>
  </div>
</body>
</html>
